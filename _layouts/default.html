<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="utf-8">
   <meta name="keywords" content="kobe sarausad, data science, statistics, seattle mariners, university of washington">
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <meta name="description" content="Kobe Sarausad - Data Analyst at Seattle Mariners. Statistics & Data Science graduate from University of Washington.">

   <title>{{ page.title }} | {{ site.title }}</title>

   <link rel="stylesheet" type="text/css" href="{{ site.path }}/css/modern-theme.css">
   <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
  <nav id="main-nav">
    <div class="nav-container">
      <a href="{{ site.path }}/" class="nav-brand">{{ site.title }}</a>

      <button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Toggle menu">
        <i class="fas fa-bars"></i>
      </button>

      <ul class="nav-links" id="nav-links">
        <li><a href="{{ site.path }}/">Home</a></li>
        <li><a href="{{ site.path }}/work.html">Work</a></li>
        <li><a href="{{ site.path }}/resume.html">Resume</a></li>
        <li><a href="{{ site.path }}/contact.html">Contact</a></li>
      </ul>
    </div>
  </nav>

  <div class="container">
    <div class="content fade-in">
      {{ content }}
    </div>
  </div>

  <script>
    // Mobile menu toggle
    const mobileMenuToggle = document.getElementById('mobile-menu-toggle');
    const navLinks = document.getElementById('nav-links');

    if (mobileMenuToggle) {
      mobileMenuToggle.addEventListener('click', () => {
        navLinks.classList.toggle('active');
      });
    }

    // Active nav link highlighting
    const currentPath = window.location.pathname;
    const navLinksElements = document.querySelectorAll('.nav-links a');

    navLinksElements.forEach(link => {
      if (link.getAttribute('href') === currentPath ||
          (currentPath === '/' && link.getAttribute('href') === '{{ site.path }}/') ||
          (currentPath.includes(link.getAttribute('href')) && link.getAttribute('href') !== '{{ site.path }}/')) {
        link.classList.add('active');
      }
    });

    // Navbar scroll effect
    const nav = document.getElementById('main-nav');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 50) {
        nav.classList.add('scrolled');
      } else {
        nav.classList.remove('scrolled');
      }
    });
  </script>
</body>
</html>
