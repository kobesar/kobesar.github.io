<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordle Score Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Clear Sans', 'Helvetica Neue', Arial, sans-serif;
            background-color: #ffffff;
            color: #1a1a1b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            border-bottom: 1px solid #d3d6da;
            padding: 12px 0;
            text-align: center;
            position: sticky;
            top: 0;
            background: white;
            z-index: 100;
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .subtitle {
            font-size: 14px;
            color: #787c7e;
            margin-top: 4px;
        }

        /* Main Container */
        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            width: 100%;
        }

        /* Input Styles */
        input[type="text"],
        textarea {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border: 1px solid #d3d6da;
            border-radius: 4px;
            font-family: inherit;
            margin-bottom: 12px;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus,
        textarea:focus {
            outline: none;
            border-color: #787c7e;
        }

        textarea {
            resize: vertical;
            min-height: 150px;
            font-size: 18px;
            line-height: 1.4;
        }

        /* Button Styles */
        button {
            background-color: #6aaa64;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
            font-family: inherit;
            width: 100%;
            margin-top: 8px;
        }

        button:hover:not(:disabled) {
            background-color: #5a9a54;
        }

        button:active:not(:disabled) {
            transform: scale(0.98);
        }

        button:disabled {
            background-color: #d3d6da;
            cursor: not-allowed;
        }

        /* Form */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #1a1a1b;
        }

        /* Leaderboard */
        .leaderboard {
            margin-top: 30px;
        }

        .leaderboard h2 {
            font-size: 20px;
            margin-bottom: 16px;
            text-align: center;
        }

        .leaderboard-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            border: 1px solid #d3d6da;
            border-radius: 8px;
            overflow: hidden;
        }

        .leaderboard-table th,
        .leaderboard-table td {
            padding: 12px;
            text-align: left;
        }

        .leaderboard-table th {
            background-color: #f6f7f8;
            font-weight: 700;
            border-bottom: 1px solid #d3d6da;
        }

        .leaderboard-table tr:not(:last-child) td {
            border-bottom: 1px solid #e8e8e8;
        }

        .leaderboard-table .rank {
            width: 50px;
            text-align: center;
            font-weight: 700;
        }

        .leaderboard-table .wins {
            width: 80px;
            text-align: center;
            font-weight: 700;
            color: #6aaa64;
        }

        .rank-1 {
            background-color: #fff8e1;
        }

        /* Daily Results */
        .daily-results {
            margin-top: 30px;
        }

        .daily-results h2 {
            font-size: 20px;
            margin-bottom: 16px;
            text-align: center;
        }

        .day-result {
            border: 1px solid #d3d6da;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
            background-color: #f6f7f8;
        }

        .day-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #d3d6da;
        }

        .day-date {
            font-weight: 700;
            font-size: 16px;
        }

        .day-winner {
            color: #6aaa64;
            font-weight: 700;
            font-size: 14px;
        }

        .day-scores {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .player-score {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            background-color: white;
            border-radius: 4px;
        }

        .player-score.winner {
            border: 2px solid #6aaa64;
            background-color: #f0f8ef;
        }

        .player-score .name {
            font-weight: 600;
        }

        .player-score .score {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .player-score .guesses {
            font-weight: 700;
            font-size: 18px;
        }

        .player-score .tiles {
            font-size: 12px;
            color: #787c7e;
        }

        .tiebreaker-note {
            font-size: 11px;
            color: #c9b458;
            font-style: italic;
            margin-left: 4px;
        }

        /* Help Text */
        .help-text {
            font-size: 13px;
            color: #787c7e;
            margin-top: 4px;
            line-height: 1.4;
        }

        /* Message */
        .message {
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 16px;
            text-align: center;
            font-weight: 600;
        }

        .message.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        /* Responsive */
        @media (max-width: 480px) {
            h1 {
                font-size: 28px;
            }

            .container {
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>WORDLE TRACKER</h1>
        <div class="subtitle">Track daily scores with everyone</div>
    </header>

    <div class="container">
        <div id="messageContainer"></div>

        <div class="form-group">
            <label>Your Name</label>
            <input type="text" id="playerNameInput" placeholder="Enter your name" autocomplete="off">
            <div class="help-text">This will be used to identify you on the leaderboard</div>
        </div>

        <div class="form-group">
            <label>Paste Your Wordle Result</label>
            <textarea id="gridInput" placeholder="Paste your entire Wordle result here...

Wordle 1,234 3/6

⬜🟨⬜⬜⬜
⬜🟩⬜🟩⬜
🟩🟩🟩🟩🟩"></textarea>
            <div class="help-text">Paste the entire Wordle share text including the emoji grid</div>
        </div>

        <button onclick="submitScore()" id="submitBtn">Submit Score</button>

        <!-- Leaderboard -->
        <div class="leaderboard">
            <h2>🏆 All-Time Leaderboard</h2>
            <table class="leaderboard-table">
                <thead>
                    <tr>
                        <th class="rank">#</th>
                        <th>Player</th>
                        <th class="wins">Wins</th>
                    </tr>
                </thead>
                <tbody id="leaderboardBody">
                </tbody>
            </table>
        </div>

        <!-- Daily Results -->
        <div class="daily-results">
            <h2>📅 Recent Results</h2>
            <div id="dailyResultsContainer"></div>
        </div>
    </div>

    <script>
        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            updateLeaderboard();
            updateDailyResults();

            // Load saved name if exists
            const savedName = localStorage.getItem('savedPlayerName');
            if (savedName) {
                document.getElementById('playerNameInput').value = savedName;
            }
        });

        // Parse Wordle Grid and extract all information
        function parseWordleResult(text) {
            const lines = text.trim().split('\n');

            // Look for the Wordle header line (e.g., "Wordle 1,234 3/6")
            let guessCount = null;
            let wordleNumber = null;

            for (let line of lines) {
                // Match patterns like "Wordle 1,234 3/6" or "Wordle 1234 X/6"
                const match = line.match(/wordle\s+[\d,]+\s+([X\d])\/6/i);
                if (match) {
                    guessCount = match[1];
                    break;
                }
            }

            // Extract emoji grid lines
            const emojiPattern = /[⬜⬛🟨🟩]+/;
            const gridLines = lines.filter(line => emojiPattern.test(line));

            // If we couldn't find guess count in header, count grid rows
            if (!guessCount && gridLines.length > 0) {
                guessCount = gridLines.length.toString();
            }

            // Count green and yellow tiles
            const fullGrid = gridLines.join('');
            const green = '🟩';
            const yellow = '🟨';

            let greenCount = 0;
            let yellowCount = 0;

            for (let char of fullGrid) {
                if (char === green) greenCount++;
                if (char === yellow) yellowCount++;
            }

            return {
                guesses: guessCount || 'X',
                green: greenCount,
                yellow: yellowCount,
                tileScore: greenCount * 1 + yellowCount * 0.5,
                grid: gridLines.join('\n'),
                valid: gridLines.length > 0
            };
        }

        // Submit Score
        function submitScore() {
            const name = document.getElementById('playerNameInput').value.trim();
            const gridText = document.getElementById('gridInput').value.trim();

            if (!name) {
                showMessage('Please enter your name', 'error');
                return;
            }

            if (!gridText) {
                showMessage('Please paste your Wordle result', 'error');
                return;
            }

            // Parse the Wordle result
            const result = parseWordleResult(gridText);

            if (!result.valid) {
                showMessage('Could not find a valid Wordle grid. Please paste the entire result.', 'error');
                return;
            }

            const today = getToday();

            // Check if this player already submitted today
            const dailyScores = getDailyScores();
            if (dailyScores[today] && dailyScores[today][name]) {
                showMessage('You already submitted a score for today!', 'error');
                return;
            }

            // Save player name for next time
            localStorage.setItem('savedPlayerName', name);

            // Save daily score
            if (!dailyScores[today]) {
                dailyScores[today] = {};
            }

            dailyScores[today][name] = {
                guesses: result.guesses,
                green: result.green,
                yellow: result.yellow,
                tileScore: result.tileScore,
                grid: result.grid
            };

            saveDailyScores(dailyScores);

            // Calculate and update winner
            calculateDailyWinner(today);

            // Clear form
            document.getElementById('gridInput').value = '';

            showMessage(`Score submitted! You got it in ${result.guesses}/6 guesses.`, 'success');
            updateLeaderboard();
            updateDailyResults();
        }

        // Calculate Daily Winner
        function calculateDailyWinner(date) {
            const dailyScores = getDailyScores();
            const dayScores = dailyScores[date];

            if (!dayScores) return;

            let winner = null;
            let bestGuesses = Infinity;
            let bestTileScore = -1;
            let isTiebreaker = false;

            // Find winner
            for (let player in dayScores) {
                const score = dayScores[player];
                const guesses = score.guesses === 'X' ? Infinity : parseInt(score.guesses);

                if (guesses < bestGuesses) {
                    winner = player;
                    bestGuesses = guesses;
                    bestTileScore = score.tileScore;
                    isTiebreaker = false;
                } else if (guesses === bestGuesses && guesses !== Infinity) {
                    // Tie - use tiebreaker
                    if (score.tileScore > bestTileScore) {
                        winner = player;
                        bestTileScore = score.tileScore;
                        isTiebreaker = true;
                    }
                }
            }

            // Update winner in daily scores
            dailyScores[date]._winner = winner;
            dailyScores[date]._isTiebreaker = isTiebreaker;
            saveDailyScores(dailyScores);

            // Update player's total wins
            if (winner) {
                const players = getPlayers();

                // Recalculate total wins for all players
                const allWins = {};
                for (let date in dailyScores) {
                    const dayWinner = dailyScores[date]._winner;
                    if (dayWinner) {
                        allWins[dayWinner] = (allWins[dayWinner] || 0) + 1;
                    }
                }

                // Get all unique player names from daily scores
                const allPlayers = new Set();
                for (let date in dailyScores) {
                    for (let player in dailyScores[date]) {
                        if (!player.startsWith('_')) {
                            allPlayers.add(player);
                        }
                    }
                }

                // Update all players' win counts
                const updatedPlayers = {};
                allPlayers.forEach(player => {
                    updatedPlayers[player] = { totalWins: allWins[player] || 0 };
                });

                savePlayers(updatedPlayers);
            }
        }

        // Update Leaderboard
        function updateLeaderboard() {
            const players = getPlayers();
            const tbody = document.getElementById('leaderboardBody');

            // Sort by wins
            const sortedPlayers = Object.entries(players).sort((a, b) => b[1].totalWins - a[1].totalWins);

            tbody.innerHTML = '';

            if (sortedPlayers.length === 0) {
                const row = tbody.insertRow();
                row.innerHTML = '<td colspan="3" style="text-align: center; padding: 20px; color: #787c7e;">No scores yet. Be the first to submit!</td>';
                return;
            }

            sortedPlayers.forEach(([name, data], index) => {
                const row = tbody.insertRow();
                if (index === 0 && data.totalWins > 0) {
                    row.classList.add('rank-1');
                }

                row.innerHTML = `
                    <td class="rank">${index + 1}</td>
                    <td>${name}</td>
                    <td class="wins">${data.totalWins}</td>
                `;
            });
        }

        // Update Daily Results
        function updateDailyResults() {
            const dailyScores = getDailyScores();
            const container = document.getElementById('dailyResultsContainer');

            // Sort dates descending
            const dates = Object.keys(dailyScores).sort().reverse();

            if (dates.length === 0) {
                container.innerHTML = '<p style="text-align: center; padding: 20px; color: #787c7e;">No daily results yet</p>';
                return;
            }

            container.innerHTML = '';
            dates.slice(0, 10).forEach(date => {
                const dayData = dailyScores[date];
                const winner = dayData._winner;
                const isTiebreaker = dayData._isTiebreaker;

                // Sort players by score
                const players = Object.entries(dayData)
                    .filter(([key]) => !key.startsWith('_'))
                    .sort((a, b) => {
                        const guessA = a[1].guesses === 'X' ? Infinity : parseInt(a[1].guesses);
                        const guessB = b[1].guesses === 'X' ? Infinity : parseInt(b[1].guesses);

                        if (guessA !== guessB) return guessA - guessB;
                        return b[1].tileScore - a[1].tileScore;
                    });

                const dayDiv = document.createElement('div');
                dayDiv.className = 'day-result';

                let scoresHTML = players.map(([name, score]) => {
                    const isWinner = name === winner;
                    const showTiebreaker = isTiebreaker && isWinner;

                    return `
                        <div class="player-score ${isWinner ? 'winner' : ''}">
                            <span class="name">${name}</span>
                            <span class="score">
                                <span class="guesses">${score.guesses}/6</span>
                                <span class="tiles">🟩${score.green} 🟨${score.yellow}</span>
                                ${showTiebreaker ? '<span class="tiebreaker-note">*tiebreaker</span>' : ''}
                            </span>
                        </div>
                    `;
                }).join('');

                dayDiv.innerHTML = `
                    <div class="day-header">
                        <span class="day-date">${formatDate(date)}</span>
                        ${winner ? `<span class="day-winner">👑 ${winner}</span>` : ''}
                    </div>
                    <div class="day-scores">
                        ${scoresHTML}
                    </div>
                `;

                container.appendChild(dayDiv);
            });
        }

        // Show Message
        function showMessage(text, type) {
            const container = document.getElementById('messageContainer');
            container.innerHTML = `<div class="message ${type}">${text}</div>`;
            setTimeout(() => {
                container.innerHTML = '';
            }, 4000);
        }

        // Helper Functions
        function getToday() {
            return new Date().toISOString().split('T')[0];
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr + 'T00:00:00');
            return date.toLocaleDateString('en-US', {
                weekday: 'short',
                month: 'short',
                day: 'numeric',
                year: 'numeric'
            });
        }

        function getPlayers() {
            return JSON.parse(localStorage.getItem('wordlePlayers') || '{}');
        }

        function savePlayers(players) {
            localStorage.setItem('wordlePlayers', JSON.stringify(players));
        }

        function getDailyScores() {
            return JSON.parse(localStorage.getItem('wordleDailyScores') || '{}');
        }

        function saveDailyScores(scores) {
            localStorage.setItem('wordleDailyScores', JSON.stringify(scores));
        }
    </script>
</body>
</html>
