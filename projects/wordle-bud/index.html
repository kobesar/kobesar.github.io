<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordle Score Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Clear Sans', 'Helvetica Neue', Arial, sans-serif;
            background-color: #ffffff;
            color: #1a1a1b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            border-bottom: 1px solid #d3d6da;
            padding: 12px 0;
            text-align: center;
            position: sticky;
            top: 0;
            background: white;
            z-index: 100;
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .subtitle {
            font-size: 14px;
            color: #787c7e;
            margin-top: 4px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            width: 100%;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border: 1px solid #d3d6da;
            border-radius: 4px;
            font-family: inherit;
            margin-bottom: 12px;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus,
        textarea:focus {
            outline: none;
            border-color: #787c7e;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
            font-size: 20px;
            line-height: 1.4;
        }

        button {
            background-color: #6aaa64;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
            font-family: inherit;
            width: 100%;
            margin-top: 8px;
        }

        button:hover:not(:disabled) {
            background-color: #5a9a54;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background-color: #d3d6da;
            cursor: not-allowed;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #1a1a1b;
        }

        .leaderboard {
            margin-top: 30px;
        }

        .leaderboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .leaderboard h2 {
            font-size: 20px;
            margin: 0;
            text-align: center;
            flex-grow: 1;
        }

        .h2h-link {
            color: #6aaa64;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            white-space: nowrap;
        }

        .h2h-link:hover {
            text-decoration: underline;
        }

        /* Matrix View */
        .matrix-container {
            overflow-x: auto;
        }

        .matrix-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        .matrix-table th,
        .matrix-table td {
            padding: 8px;
            text-align: center;
            border: 1px solid #d3d6da;
            min-width: 60px;
        }

        .matrix-table th {
            background-color: #f6f7f8;
            font-weight: 700;
            position: sticky;
            z-index: 1;
        }

        .matrix-table th:first-child {
            left: 0;
            z-index: 2;
        }

        .matrix-table tbody th {
            background-color: #f6f7f8;
            font-weight: 600;
            text-align: left;
            position: sticky;
            left: 0;
        }

        .matrix-table .self-cell {
            background-color: #e8e8e8;
            color: #d3d6da;
        }

        .matrix-table .winning-record {
            background-color: #d4edda;
            color: #155724;
            font-weight: 600;
        }

        .matrix-table .losing-record {
            background-color: #f8d7da;
            color: #721c24;
            font-weight: 600;
        }

        .matrix-table .tied-record {
            background-color: #fff3cd;
            color: #856404;
            font-weight: 600;
        }

        .matrix-table .no-matchup {
            background-color: #fafafa;
            color: #d3d6da;
        }

        .daily-results {
            margin-top: 30px;
        }

        .daily-results h2 {
            font-size: 20px;
            margin-bottom: 16px;
            text-align: center;
        }

        .day-result {
            border: 1px solid #d3d6da;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
            background-color: #f6f7f8;
        }

        .day-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #d3d6da;
        }

        .day-date {
            font-weight: 700;
            font-size: 16px;
        }

        .day-winner {
            color: #6aaa64;
            font-weight: 700;
            font-size: 14px;
        }

        .day-scores {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .player-score {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            background-color: white;
            border-radius: 4px;
        }

        .player-score.winner {
            border: 2px solid #6aaa64;
            background-color: #f0f8ef;
        }

        .player-score .name {
            font-weight: 600;
        }

        .player-score .score {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .player-score .guesses {
            font-weight: 700;
            font-size: 18px;
        }

        .player-score .tiles {
            font-size: 12px;
            color: #787c7e;
        }

        .tiebreaker-note {
            font-size: 11px;
            color: #c9b458;
            font-style: italic;
            margin-left: 4px;
        }

        .help-text {
            font-size: 13px;
            color: #787c7e;
            margin-top: 4px;
            line-height: 1.4;
        }

        .message {
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 16px;
            text-align: center;
            font-weight: 600;
        }

        .message.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .message.info {
            background-color: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .loading {
            text-align: center;
            padding: 40px 20px;
            color: #787c7e;
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 28px;
            }

            .container {
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>WORDLE TRACKER</h1>
        <div class="subtitle">Track daily scores with friends</div>
    </header>

    <div class="container">
        <div id="messageContainer"></div>

        <div id="loadingSection" class="loading">
            Connecting to server...
        </div>

        <div id="mainSection" style="display: none;">
            <div class="form-group">
                <label>Your Name</label>
                <input type="text" id="playerNameInput" placeholder="Enter your name" autocomplete="off">
                <div class="help-text">This will be used to identify you on the leaderboard</div>
            </div>

            <div class="form-group">
                <label>Paste Your Wordle Result</label>
                <textarea id="gridInput" placeholder="Paste your entire Wordle result here...

Wordle 1,234 3/6

⬜🟨⬜⬜⬜
⬜🟩⬜🟩⬜
🟩🟩🟩🟩🟩"></textarea>
                <div class="help-text">Paste the entire Wordle share text including the emoji grid. We'll automatically detect your guess count!</div>
            </div>

            <button onclick="submitScore()" id="submitBtn">Submit Score</button>

            <div class="leaderboard">
                <div class="leaderboard-header">
                    <h2>🏆 Head-to-Head Matrix</h2>
                    <a href="head-to-head.html" class="h2h-link">Compare Players →</a>
                </div>

                <div class="matrix-container">
                    <table class="matrix-table" id="matrixTable">
                    </table>
                </div>
            </div>

            <div class="daily-results">
                <h2>📅 Recent Results</h2>
                <div id="dailyResultsContainer"></div>
            </div>
        </div>
    </div>

    <!-- Core Functions -->
    <script>
        // UI and utility functions
        function getLocalDateString() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function showMessage(text, type = 'info') {
            const container = document.getElementById('messageContainer');
            container.innerHTML = `<div class="message ${type}">${text}</div>`;
            setTimeout(() => container.innerHTML = '', 5000);
        }

        function parseWordleResult(text) {
            const lines = text.trim().split('\n');
            let guessCount = null;

            // Look for Wordle header line (e.g., "Wordle 1,234 3/6" or "Wordle 1234 3/6")
            for (let line of lines) {
                const match = line.match(/wordle\s+[\d,]+\s+([X\d])\/6/i);
                if (match) {
                    guessCount = match[1];
                    break;
                }
            }

            // Find all lines with Wordle emoji squares
            const emojiPattern = /[⬜⬛🟨🟩]+/;
            const gridLines = lines.filter(line => emojiPattern.test(line));

            // If no guess count found in header, count the grid lines
            if (!guessCount && gridLines.length > 0) {
                guessCount = gridLines.length.toString();
            }

            // Count green and yellow tiles for tiebreaker
            const fullGrid = gridLines.join('');
            let greenCount = 0;
            let yellowCount = 0;

            for (let char of fullGrid) {
                if (char === '🟩') greenCount++;
                if (char === '🟨') yellowCount++;
            }

            return {
                guesses: guessCount || 'X',
                green: greenCount,
                yellow: yellowCount,
                tileScore: greenCount * 1 + yellowCount * 0.5,
                grid: gridLines.join('\n'),
                valid: gridLines.length > 0
            };
        }

        async function submitScore() {
            const name = document.getElementById('playerNameInput').value.trim();
            const gridText = document.getElementById('gridInput').value.trim();

            if (!name) {
                showMessage('Please enter your name', 'error');
                return;
            }

            if (!gridText) {
                showMessage('Please paste your Wordle result', 'error');
                return;
            }

            const result = parseWordleResult(gridText);

            if (!result.valid) {
                showMessage('Could not find a valid Wordle grid. Please paste the entire result.', 'error');
                return;
            }

            const today = getLocalDateString();

            // Check if already submitted
            if (window.roomData.dailyScores[today] && window.roomData.dailyScores[today][name]) {
                showMessage('You already submitted a score for today!', 'error');
                return;
            }

            // Save player name
            window.currentPlayer = name;
            localStorage.setItem('playerName', name);

            const roomRef = window.firestoreFunctions.doc(window.db, 'rooms', 'GLOBAL');

            try {
                // Add player to room if not exists
                if (!window.roomData.players[name]) {
                    await window.firestoreFunctions.updateDoc(roomRef, {
                        [`players.${name}`]: {
                            name: name,
                            totalWins: 0,
                            joinedAt: new Date().toISOString()
                        }
                    });
                }

                // Submit score
                await window.firestoreFunctions.updateDoc(roomRef, {
                    [`dailyScores.${today}.${name}`]: {
                        guesses: result.guesses,
                        green: result.green,
                        yellow: result.yellow,
                        tileScore: result.tileScore,
                        grid: result.grid,
                        submittedAt: new Date().toISOString()
                    }
                });

                // Calculate winner for today
                await calculateDailyWinner(today);

                // Clear form
                document.getElementById('gridInput').value = '';

                showMessage(`Score submitted! You got it in ${result.guesses}/6 guesses.`, 'success');
            } catch (error) {
                console.error('Error submitting score:', error);
                showMessage('Failed to submit score. Please try again.', 'error');
            }
        }

        async function calculateDailyWinner(date) {
            const room = window.roomData;
            const dayScores = room.dailyScores[date];

            if (!dayScores) return;

            let winner = null;
            let bestGuesses = Infinity;
            let bestTileScore = -1;
            let isTiebreaker = false;

            // Find winner
            for (let player in dayScores) {
                if (player.startsWith('_')) continue;

                const score = dayScores[player];
                const guesses = score.guesses === 'X' ? Infinity : parseInt(score.guesses);

                if (guesses < bestGuesses) {
                    winner = player;
                    bestGuesses = guesses;
                    bestTileScore = score.tileScore;
                    isTiebreaker = false;
                } else if (guesses === bestGuesses && guesses !== Infinity) {
                    if (score.tileScore > bestTileScore) {
                        winner = player;
                        bestTileScore = score.tileScore;
                        isTiebreaker = true;
                    }
                }
            }

            // Update winner in Firestore
            const roomRef = window.firestoreFunctions.doc(window.db, 'rooms', 'GLOBAL');
            await window.firestoreFunctions.updateDoc(roomRef, {
                [`dailyScores.${date}._winner`]: winner,
                [`dailyScores.${date}._isTiebreaker`]: isTiebreaker
            });

            // Update player's total wins
            if (winner) {
                // Recalculate all wins
                const allWins = {};
                for (let d in room.dailyScores) {
                    const dayWinner = room.dailyScores[d]._winner;
                    if (dayWinner) {
                        allWins[dayWinner] = (allWins[dayWinner] || 0) + 1;
                    }
                }

                // Update all players' win counts
                const updates = {};
                for (let player in room.players) {
                    updates[`players.${player}.totalWins`] = allWins[player] || 0;
                }

                await window.firestoreFunctions.updateDoc(roomRef, updates);
            }
        }

        function checkTodaySubmission() {
            const today = getLocalDateString();
            const room = window.roomData;
            const name = window.currentPlayer;
            const lastCheckedDate = localStorage.getItem('lastCheckedDate');

            // Clear the grid if it's a new day
            if (lastCheckedDate && lastCheckedDate !== today) {
                document.getElementById('gridInput').value = '';
            }
            localStorage.setItem('lastCheckedDate', today);

            if (name && room.dailyScores[today] && room.dailyScores[today][name]) {
                disableSubmission();
            } else {
                enableSubmission();
            }
        }

        function disableSubmission() {
            document.getElementById('gridInput').disabled = true;
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Already Submitted Today';
        }

        function enableSubmission() {
            document.getElementById('gridInput').disabled = false;
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Submit Score';
        }

        function updateUI() {
            updateMatrixView();
            updateDailyResults();
        }

        function updateMatrixView() {
            const room = window.roomData;
            if (!room || !room.players) return;

            const players = Object.keys(room.players).sort();
            if (players.length === 0) return;

            // Calculate all head-to-head records
            const h2hRecords = {};
            players.forEach(p1 => {
                h2hRecords[p1] = {};
                players.forEach(p2 => {
                    h2hRecords[p1][p2] = { wins: 0, losses: 0, ties: 0 };
                });
            });

            // Analyze daily scores
            const dailyScores = room.dailyScores || {};
            for (let date in dailyScores) {
                const dayData = dailyScores[date];

                // Compare each pair of players who played that day
                for (let i = 0; i < players.length; i++) {
                    for (let j = 0; j < players.length; j++) {
                        if (i === j) continue;

                        const p1 = players[i];
                        const p2 = players[j];
                        const p1Score = dayData[p1];
                        const p2Score = dayData[p2];

                        if (p1Score && p2Score) {
                            const p1Guesses = p1Score.guesses === 'X' ? Infinity : parseInt(p1Score.guesses);
                            const p2Guesses = p2Score.guesses === 'X' ? Infinity : parseInt(p2Score.guesses);

                            if (p1Guesses < p2Guesses) {
                                h2hRecords[p1][p2].wins++;
                            } else if (p2Guesses < p1Guesses) {
                                h2hRecords[p1][p2].losses++;
                            } else {
                                // Tiebreaker
                                if (p1Score.tileScore > p2Score.tileScore) {
                                    h2hRecords[p1][p2].wins++;
                                } else if (p2Score.tileScore > p1Score.tileScore) {
                                    h2hRecords[p1][p2].losses++;
                                } else {
                                    h2hRecords[p1][p2].ties++;
                                }
                            }
                        }
                    }
                }
            }

            // Build matrix table
            const matrixTable = document.getElementById('matrixTable');
            let html = '<thead><tr><th></th>';

            // Header row with player names
            players.forEach(player => {
                html += `<th title="${player}">${truncateName(player, 8)}</th>`;
            });
            html += '</tr></thead><tbody>';

            // Data rows
            players.forEach(rowPlayer => {
                html += `<tr><th title="${rowPlayer}">${truncateName(rowPlayer, 12)}</th>`;

                players.forEach(colPlayer => {
                    if (rowPlayer === colPlayer) {
                        html += '<td class="self-cell">—</td>';
                    } else {
                        const record = h2hRecords[rowPlayer][colPlayer];
                        const total = record.wins + record.losses + record.ties;

                        if (total === 0) {
                            html += '<td class="no-matchup">—</td>';
                        } else {
                            let cellClass = '';
                            if (record.wins > record.losses) {
                                cellClass = 'winning-record';
                            } else if (record.losses > record.wins) {
                                cellClass = 'losing-record';
                            } else {
                                cellClass = 'tied-record';
                            }

                            html += `<td class="${cellClass}" title="${rowPlayer} vs ${colPlayer}: ${record.wins}-${record.losses}${record.ties > 0 ? '-' + record.ties : ''}">${record.wins}-${record.losses}${record.ties > 0 ? '-' + record.ties : ''}</td>`;
                        }
                    }
                });

                html += '</tr>';
            });

            html += '</tbody>';
            matrixTable.innerHTML = html;
        }

        function truncateName(name, maxLength) {
            if (name.length <= maxLength) return name;
            return name.substring(0, maxLength - 1) + '…';
        }

        function updateDailyResults() {
            const room = window.roomData;
            if (!room) return;

            const container = document.getElementById('dailyResultsContainer');
            const dates = Object.keys(room.dailyScores || {}).sort().reverse();

            if (dates.length === 0) {
                container.innerHTML = '<p style="text-align: center; padding: 20px; color: #787c7e;">No daily results yet</p>';
                return;
            }

            container.innerHTML = '';
            dates.slice(0, 10).forEach(date => {
                const dayData = room.dailyScores[date];
                const winner = dayData._winner;
                const isTiebreaker = dayData._isTiebreaker;

                const players = Object.entries(dayData)
                    .filter(([key]) => !key.startsWith('_'))
                    .sort((a, b) => {
                        const guessA = a[1].guesses === 'X' ? Infinity : parseInt(a[1].guesses);
                        const guessB = b[1].guesses === 'X' ? Infinity : parseInt(b[1].guesses);

                        if (guessA !== guessB) return guessA - guessB;
                        return b[1].tileScore - a[1].tileScore;
                    });

                const dayDiv = document.createElement('div');
                dayDiv.className = 'day-result';

                let scoresHTML = players.map(([name, score]) => {
                    const isWinner = name === winner;
                    const showTiebreaker = isTiebreaker && isWinner;

                    return `
                        <div class="player-score ${isWinner ? 'winner' : ''}">
                            <span class="name">${name}</span>
                            <span class="score">
                                <span class="guesses">${score.guesses}/6</span>
                                <span class="tiles">🟩${score.green} 🟨${score.yellow}</span>
                                ${showTiebreaker ? '<span class="tiebreaker-note">*tiebreaker</span>' : ''}
                            </span>
                        </div>
                    `;
                }).join('');

                dayDiv.innerHTML = `
                    <div class="day-header">
                        <span class="day-date">${formatDate(date)}</span>
                        ${winner ? `<span class="day-winner">👑 ${winner}</span>` : ''}
                    </div>
                    <div class="day-scores">
                        ${scoresHTML}
                    </div>
                `;

                container.appendChild(dayDiv);
            });
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr + 'T00:00:00');
            return date.toLocaleDateString('en-US', {
                weekday: 'short',
                month: 'short',
                day: 'numeric',
                year: 'numeric'
            });
        }
    </script>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, updateDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        // Firebase configuration
        const firebaseConfig = {
          apiKey: "AIzaSyANQVhxx3zaXrW5g8nMFewLvLUQvNZhjXQ",
          authDomain: "wordle-bud.firebaseapp.com",
          projectId: "wordle-bud",
          storageBucket: "wordle-bud.firebasestorage.app",
          messagingSenderId: "3991484624",
          appId: "1:3991484624:web:dcefe2846c3e5aad8c06d5",
          measurementId: "G-QZSSYLP05D"
        };

        // Initialize Firebase
        let app, db;
        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            console.log('Firebase initialized successfully');
        } catch (error) {
            console.error('Firebase initialization error:', error);
            showMessage('Failed to connect to server. Please refresh the page.', 'error');
        }

        // Global state
        window.currentPlayer = localStorage.getItem('playerName') || null;
        window.roomData = null;
        window.unsubscribeRoom = null;

        // Make Firebase functions available globally
        window.db = db;
        window.firestoreFunctions = { doc, setDoc, getDoc, onSnapshot, updateDoc };

        // Initialize global room
        initializeGlobalRoom();

        async function initializeGlobalRoom() {
            const ROOM_CODE = 'GLOBAL';
            const roomRef = doc(db, 'rooms', ROOM_CODE);

            try {
                const roomSnap = await getDoc(roomRef);

                if (!roomSnap.exists()) {
                    // Create global room if it doesn't exist
                    await setDoc(roomRef, {
                        code: ROOM_CODE,
                        createdAt: new Date().toISOString(),
                        players: {},
                        dailyScores: {}
                    });
                }

                // Subscribe to room updates
                window.unsubscribeRoom = onSnapshot(roomRef, (doc) => {
                    window.roomData = doc.data();
                    updateUI();
                    checkTodaySubmission();
                });

                document.getElementById('loadingSection').style.display = 'none';
                document.getElementById('mainSection').style.display = 'block';

                // Load saved player name
                if (window.currentPlayer) {
                    document.getElementById('playerNameInput').value = window.currentPlayer;
                }

            } catch (error) {
                console.error('Error initializing room:', error);
                showMessage('Failed to connect to server. Please refresh the page.', 'error');
            }
        }

        // Make functions globally available
        window.initializeGlobalRoom = initializeGlobalRoom;
    </script>
</body>
</html>
