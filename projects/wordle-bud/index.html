<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordle Score Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Clear Sans', 'Helvetica Neue', Arial, sans-serif;
            background-color: #ffffff;
            color: #1a1a1b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            border-bottom: 1px solid #d3d6da;
            padding: 12px 0;
            text-align: center;
            position: sticky;
            top: 0;
            background: white;
            z-index: 100;
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .subtitle {
            font-size: 14px;
            color: #787c7e;
            margin-top: 4px;
        }

        /* Main Container */
        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            width: 100%;
        }

        /* Section Visibility */
        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        /* Common Styles */
        .card {
            background-color: #f6f7f8;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 16px;
        }

        h2 {
            font-size: 20px;
            margin-bottom: 16px;
            color: #1a1a1b;
        }

        h3 {
            font-size: 16px;
            margin-bottom: 12px;
            color: #1a1a1b;
        }

        /* Input Styles */
        input[type="text"],
        input[type="number"],
        textarea,
        select {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border: 1px solid #d3d6da;
            border-radius: 4px;
            font-family: inherit;
            margin-bottom: 12px;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #787c7e;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
            font-size: 20px;
            line-height: 1.4;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #1a1a1b;
        }

        /* Button Styles */
        button {
            background-color: #6aaa64;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
            font-family: inherit;
            width: 100%;
            margin-top: 8px;
        }

        button:hover:not(:disabled) {
            background-color: #5a9a54;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background-color: #d3d6da;
            cursor: not-allowed;
        }

        button.secondary {
            background-color: #787c7e;
        }

        button.secondary:hover:not(:disabled) {
            background-color: #6a6d70;
        }

        button.small {
            padding: 8px 16px;
            font-size: 14px;
            width: auto;
            margin: 0;
        }

        /* Room Selection */
        .mode-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .mode-card {
            background-color: white;
            border: 2px solid #d3d6da;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mode-card:hover {
            border-color: #6aaa64;
            background-color: #f6f7f8;
        }

        .mode-card.selected {
            border-color: #6aaa64;
            background-color: #e8f5e7;
        }

        .mode-card .icon {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .mode-card .title {
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 4px;
        }

        .mode-card .description {
            font-size: 12px;
            color: #787c7e;
        }

        /* Room Info */
        .room-info {
            background-color: #f6f7f8;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .room-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .room-name {
            font-weight: 700;
            font-size: 18px;
        }

        .room-code {
            font-family: 'Courier New', monospace;
            background-color: white;
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid #d3d6da;
            font-size: 16px;
            font-weight: 700;
            color: #6aaa64;
        }

        .room-mode {
            display: inline-block;
            padding: 4px 12px;
            background-color: white;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        /* Players List */
        .players-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }

        .player-tag {
            background-color: white;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 14px;
            border: 1px solid #d3d6da;
        }

        .player-tag.current {
            border-color: #6aaa64;
            background-color: #e8f5e7;
            font-weight: 600;
        }

        /* Guess Options */
        .guess-options {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }

        .guess-btn {
            padding: 16px;
            background-color: #ffffff;
            border: 2px solid #d3d6da;
            color: #1a1a1b;
            font-weight: 700;
            font-size: 18px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            margin: 0;
        }

        .guess-btn:hover:not(:disabled) {
            border-color: #787c7e;
            background-color: #f6f7f8;
        }

        .guess-btn.selected {
            background-color: #6aaa64;
            border-color: #6aaa64;
            color: white;
        }

        .guess-btn.failed {
            background-color: #787c7e;
            border-color: #787c7e;
            color: white;
        }

        /* Leaderboard */
        .leaderboard-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            border: 1px solid #d3d6da;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .leaderboard-table th,
        .leaderboard-table td {
            padding: 12px;
            text-align: left;
        }

        .leaderboard-table th {
            background-color: #f6f7f8;
            font-weight: 700;
            border-bottom: 1px solid #d3d6da;
        }

        .leaderboard-table tr:not(:last-child) td {
            border-bottom: 1px solid #e8e8e8;
        }

        .leaderboard-table .rank {
            width: 50px;
            text-align: center;
            font-weight: 700;
        }

        .leaderboard-table .wins {
            width: 80px;
            text-align: center;
            font-weight: 700;
            color: #6aaa64;
        }

        .rank-1 {
            background-color: #fff8e1;
        }

        /* Daily Results */
        .day-result {
            border: 1px solid #d3d6da;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
            background-color: #f6f7f8;
        }

        .day-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #d3d6da;
        }

        .day-date {
            font-weight: 700;
            font-size: 16px;
        }

        .day-winner {
            color: #6aaa64;
            font-weight: 700;
            font-size: 14px;
        }

        .day-scores {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .player-score {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            background-color: white;
            border-radius: 4px;
        }

        .player-score.winner {
            border: 2px solid #6aaa64;
            background-color: #f0f8ef;
        }

        .player-score .name {
            font-weight: 600;
        }

        .player-score .score {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .player-score .guesses {
            font-weight: 700;
            font-size: 18px;
        }

        .player-score .tiles {
            font-size: 12px;
            color: #787c7e;
        }

        .tiebreaker-note {
            font-size: 11px;
            color: #c9b458;
            font-style: italic;
            margin-left: 4px;
        }

        /* Message */
        .message {
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 16px;
            text-align: center;
            font-weight: 600;
        }

        .message.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .message.info {
            background-color: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .loading {
            text-align: center;
            padding: 40px 20px;
            color: #787c7e;
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 28px;
            }

            .container {
                padding: 12px;
            }

            .mode-selector {
                grid-template-columns: 1fr;
            }

            .guess-options {
                gap: 6px;
            }

            .guess-btn {
                padding: 12px 8px;
                font-size: 16px;
            }
        }
    </style>
</head>

        // Initialize Firebase
        let app, db;
        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            console.log('Firebase initialized successfully');
        } catch (error) {
            console.error('Firebase initialization error:', error);
            showMessage('Failed to connect to server. Please refresh the page.', 'error');
        }

        // Global state
        window.currentPlayer = localStorage.getItem('playerName') || null;
        window.roomData = null;
        window.unsubscribeRoom = null;

        // Make Firebase functions available globally
        window.db = db;
        window.firestoreFunctions = { doc, setDoc, getDoc, onSnapshot, updateDoc };

        // Initialize global room
        initializeGlobalRoom();

        async function initializeGlobalRoom() {
            const ROOM_CODE = 'GLOBAL';
            const roomRef = doc(db, 'rooms', ROOM_CODE);

            try {
                const roomSnap = await getDoc(roomRef);

                if (!roomSnap.exists()) {
                    // Create global room if it doesn't exist
                    await setDoc(roomRef, {
                        code: ROOM_CODE,
                        createdAt: new Date().toISOString(),
                        players: {},
                        dailyScores: {}
                    });
                }

                // Subscribe to room updates
                window.unsubscribeRoom = onSnapshot(roomRef, (doc) => {
                    window.roomData = doc.data();
                    updateUI();
                    checkTodaySubmission();
                });

                document.getElementById('loadingSection').style.display = 'none';
                document.getElementById('mainSection').style.display = 'block';

                // Load saved player name
                if (window.currentPlayer) {
                    document.getElementById('playerNameInput').value = window.currentPlayer;
                }

            } catch (error) {
                console.error('Error initializing room:', error);
                showMessage('Failed to connect to server. Please refresh the page.', 'error');
            }
        }

        // Make functions globally available
        window.initializeGlobalRoom = initializeGlobalRoom;

    <script>
        function showMessage(text, type = 'info') {
            const container = document.getElementById('messageContainer');
            container.innerHTML = `<div class="message ${type}">${text}</div>`;
            setTimeout(() => container.innerHTML = '', 5000);
        }

        function parseWordleResult(text) {
            const lines = text.trim().split('\n');
            let guessCount = null;

            // Look for Wordle header line (e.g., "Wordle 1,234 3/6" or "Wordle 1234 3/6")
            for (let line of lines) {
                const match = line.match(/wordle\s+[\d,]+\s+([X\d])\/6/i);
                if (match) {
                    guessCount = match[1];
                    break;
                }
            }
        }
    </script>

    <script>
        // UI Management
        function showSection(sectionId) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(sectionId).classList.add('active');
        }

        function showMessage(text, type = 'info') {
            const container = document.getElementById('messageContainer');
            container.innerHTML = `<div class="message ${type}">${text}</div>`;
            setTimeout(() => container.innerHTML = '', 5000);
        }

        // Player Name Setup
        function setPlayerName() {
            const name = document.getElementById('playerNameInput').value.trim();
            if (!name) {
                showMessage('Please enter your name', 'error');
                return;
            }
            window.currentPlayer = name;
            localStorage.setItem('playerName', name);
            showSection('roomSelectionSection');
        }

        // Mode Selection
        function selectMode(mode) {
            window.selectedMode = mode;
            document.querySelectorAll('.mode-card').forEach(card => card.classList.remove('selected'));
            event.target.closest('.mode-card').classList.add('selected');
            document.getElementById('modeOptions').style.display = 'block';
        }

        // Room Management
        function generateRoomCode() {
            return Math.random().toString(36).substring(2, 8).toUpperCase();
        }

        async function createRoom() {
            if (!window.selectedMode) {
                showMessage('Please select a game mode first', 'error');
                return;
            }

            return {
                guesses: guessCount || 'X',
                green: greenCount,
                yellow: yellowCount,
                tileScore: greenCount * 1 + yellowCount * 0.5,
                grid: gridLines.join('\n'),
                valid: gridLines.length > 0
            };
        }

        async function submitScore() {
            const name = document.getElementById('playerNameInput').value.trim();
            const gridText = document.getElementById('gridInput').value.trim();

            if (!name) {
                showMessage('Please enter your name', 'error');
                return;
            }

            const roomRef = window.firestoreFunctions.doc(window.db, 'rooms', roomCode);

            try {
                const roomSnap = await window.firestoreFunctions.getDoc(roomRef);

                if (!roomSnap.exists()) {
                    showMessage('Room not found', 'error');
                    return;
                }

                const roomData = roomSnap.data();

                // Check if room is 1v1 and already has 2 players
                if (roomData.mode === '1v1' && Object.keys(roomData.players || {}).length >= 2) {
                    if (!roomData.players[window.currentPlayer]) {
                        showMessage('This 1v1 room is full', 'error');
                        return;
                    }
                }

                // Add player to room if not already in
                if (!roomData.players[window.currentPlayer]) {
                    await window.firestoreFunctions.updateDoc(roomRef, {
                        [`players.${window.currentPlayer}`]: {
                            name: window.currentPlayer,
                            totalWins: 0,

                        }
                    });
                }

                window.currentRoom = roomCode;
                localStorage.setItem('currentRoom', roomCode);
                loadRoom(roomCode);
                showMessage('Joined room successfully!', 'success');
            } catch (error) {
                console.error('Error joining room:', error);
                showMessage('Failed to join room', 'error');
            }
        }

            const result = parseWordleResult(gridText);

            // Unsubscribe from previous room if any
            if (window.unsubscribeRoom) {
                window.unsubscribeRoom();
            }

            const today = new Date().toISOString().split('T')[0];

            // Check if already submitted
            if (window.roomData.dailyScores[today] && window.roomData.dailyScores[today][name]) {
                showMessage('You already submitted a score for today!', 'error');
                return;
            }
            window.currentRoom = null;
            window.roomData = null;
            localStorage.removeItem('currentRoom');
            showSection('roomSelectionSection');
        }

            // Save player name
            window.currentPlayer = name;
            localStorage.setItem('playerName', name);

            const roomRef = window.firestoreFunctions.doc(window.db, 'rooms', 'GLOBAL');

            try {
                // Add player to room if not exists
                if (!window.roomData.players[name]) {
                    await window.firestoreFunctions.updateDoc(roomRef, {
                        [`players.${name}`]: {
                            name: name,
                            totalWins: 0,
                            joinedAt: new Date().toISOString()
                        }
                    });
                }

                // Submit score
                await window.firestoreFunctions.updateDoc(roomRef, {
                    [`dailyScores.${today}.${name}`]: {
                        guesses: result.guesses,
                        green: result.green,
                        yellow: result.yellow,
                        tileScore: result.tileScore,
                        grid: result.grid,
                        submittedAt: new Date().toISOString()
                    }
                });

                // Calculate winner for today
                await calculateDailyWinner(today);

                // Clear form
                document.getElementById('gridInput').value = '';

                showMessage(`Score submitted! You got it in ${result.guesses}/6 guesses.`, 'success');
            } catch (error) {
                console.error('Error submitting score:', error);
                showMessage('Failed to submit score. Please try again.', 'error');
            }
        }

        async function calculateDailyWinner(date) {
            const room = window.roomData;
            const dayScores = room.dailyScores[date];

            if (!dayScores) return;

            let winner = null;
            let bestGuesses = Infinity;
            let bestTileScore = -1;
            let isTiebreaker = false;

            // Find winner
            for (let player in dayScores) {
                if (player.startsWith('_')) continue;

                const score = dayScores[player];
                const guesses = score.guesses === 'X' ? Infinity : parseInt(score.guesses);

                if (guesses < bestGuesses) {
                    winner = player;
                    bestGuesses = guesses;
                    bestTileScore = score.tileScore;
                    isTiebreaker = false;
                } else if (guesses === bestGuesses && guesses !== Infinity) {
                    if (score.tileScore > bestTileScore) {
                        winner = player;
                        bestTileScore = score.tileScore;
                        isTiebreaker = true;
                    }
                }
            }

            // Update winner in Firestore
            const roomRef = window.firestoreFunctions.doc(window.db, 'rooms', 'GLOBAL');
            await window.firestoreFunctions.updateDoc(roomRef, {
                [`dailyScores.${date}._winner`]: winner,
                [`dailyScores.${date}._isTiebreaker`]: isTiebreaker
            });

            // Update player's total wins
            if (winner) {
                // Recalculate all wins
                const allWins = {};
                for (let d in room.dailyScores) {
                    const dayWinner = room.dailyScores[d]._winner;
                    if (dayWinner) {
                        allWins[dayWinner] = (allWins[dayWinner] || 0) + 1;
                    }
                }

                // Update all players' win counts
                const updates = {};
                for (let player in room.players) {
                    updates[`players.${player}.totalWins`] = allWins[player] || 0;
                }

                await window.firestoreFunctions.updateDoc(roomRef, updates);
            }
        }

        function checkTodaySubmission() {
            const today = new Date().toISOString().split('T')[0];
            const room = window.roomData;
            const name = window.currentPlayer;

            if (name && room.dailyScores[today] && room.dailyScores[today][name]) {
                disableSubmission();
            } else {
                enableSubmission();
            }
        }

        function disableSubmission() {
            document.getElementById('gridInput').disabled = true;
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Already Submitted Today';
        }

        function enableSubmission() {
            document.getElementById('gridInput').disabled = false;
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Submit Score';
        }

        function updateUI() {
            updateLeaderboard();
            updateDailyResults();
        }

        function updateLeaderboard() {
            const room = window.roomData;
            if (!room || !room.players) return;

            const tbody = document.getElementById('leaderboardBody');
            const sortedPlayers = Object.entries(room.players).sort((a, b) =>
                (b[1].totalWins || 0) - (a[1].totalWins || 0)
            );

            const sortedPlayers = Object.entries(room.players).sort((a, b) =>
                (b[1].totalWins || 0) - (a[1].totalWins || 0)
            );

            if (sortedPlayers.length === 0) {
                const row = tbody.insertRow();
                row.innerHTML = '<td colspan="3" style="text-align: center; padding: 20px; color: #787c7e;">No scores yet. Be the first to submit!</td>';
                return;
            }

            sortedPlayers.forEach(([playerId, player], index) => {
                const row = tbody.insertRow();
                if (index === 0 && player.totalWins > 0) {
                    row.classList.add('rank-1');
                }

                row.innerHTML = `
                    <td class="rank">${index + 1}</td>
                    <td>${player.name}</td>
                    <td class="wins">${player.totalWins || 0}</td>
                `;
            });
        }

        function updateDailyResults() {
            const room = window.roomData;
            if (!room) return;

            const container = document.getElementById('dailyResultsContainer');
            const dates = Object.keys(room.dailyScores || {}).sort().reverse();

            const dates = Object.keys(room.dailyScores || {}).sort().reverse();

            container.innerHTML = '';
            dates.slice(0, 10).forEach(date => {
                const dayData = room.dailyScores[date];
                const winner = dayData._winner;
                const isTiebreaker = dayData._isTiebreaker;

                const players = Object.entries(dayData)
                    .filter(([key]) => !key.startsWith('_'))
                    .sort((a, b) => {
                        const guessA = a[1].guesses === 'X' ? Infinity : parseInt(a[1].guesses);
                        const guessB = b[1].guesses === 'X' ? Infinity : parseInt(b[1].guesses);
                        if (guessA !== guessB) return guessA - guessB;
                        return b[1].tileScore - a[1].tileScore;
                    });

                const dayDiv = document.createElement('div');
                dayDiv.className = 'day-result';

                let scoresHTML = players.map(([name, score]) => {
                    const isWinner = name === winner;
                    const showTiebreaker = isTiebreaker && isWinner;

                    return `
                        <div class="player-score ${isWinner ? 'winner' : ''}">
                            <span class="name">${name}</span>
                            <span class="score">
                                <span class="guesses">${score.guesses}</span>
                                <span class="tiles">🟩${score.green} 🟨${score.yellow}</span>
                                ${showTiebreaker ? '<span class="tiebreaker-note">*tiebreaker</span>' : ''}
                            </span>
                        </div>
                    `;
                }).join('');

                dayDiv.innerHTML = `
                    <div class="day-header">
                        <span class="day-date">${formatDate(date)}</span>
                        ${winner ? `<span class="day-winner">👑 ${winner}</span>` : ''}
                    </div>
                    <div class="day-scores">
                        ${scoresHTML}
                    </div>
                `;

                container.appendChild(dayDiv);
            });

        function formatDate(dateStr) {
            const date = new Date(dateStr + 'T00:00:00');
            return date.toLocaleDateString('en-US', {
                weekday: 'short',
                month: 'short',
                day: 'numeric',
                year: 'numeric'
            });
        }
    </script>
</body>
</html>
